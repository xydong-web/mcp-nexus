services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mcp_nexus
      POSTGRES_USER: mcp_nexus
      POSTGRES_PASSWORD: mcp_nexus_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp_nexus -d mcp_nexus"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mcp_nexus_postgres:/var/lib/postgresql/data

  bridge-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      DATABASE_URL: "postgresql://mcp_nexus:mcp_nexus_dev@postgres:5432/mcp_nexus?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8787:8787"
    command: ["sh", "docker/entrypoint.sh"]

volumes:
  mcp_nexus_postgres: {}
